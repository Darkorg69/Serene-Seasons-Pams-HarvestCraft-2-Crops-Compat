subprojects {
    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    java.withSourcesJar()
    java.withJavadocJar()

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_id}" }
        }
        manifest {
            attributes(['Specification-Title'     : mod_name,
                        'Specification-Vendor'    : mod_authors,
                        'Specification-Version'   : project.jar.archiveVersion,
                        'Implementation-Title'    : project.name,
                        'Implementation-Version'  : project.jar.archiveVersion,
                        'Implementation-Vendor'   : mod_authors,
                        'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                        'Timestamp'               : System.currentTimeMillis(),
                        'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                        'Built-On-Minecraft'      : minecraft_version])
        }
    }

    sourcesJar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://www.cursemaven.com" }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.getRelease().set(21)
    }

    processResources {
        def properties = ["projectGroup"              : project.group,
                          //Mod
                          "mod_id"                    : mod_id,
                          "mod_version"               : mod_version,
                          "mod_name"                  : mod_name,
                          //Minecraft
                          "minecraft_version"         : minecraft_version,
                          "minecraft_version_range"   : minecraft_version_range,
                          //Common
                          "mod_authors"               : mod_authors,
                          "mod_license"               : mod_license,
                          "mod_description"           : mod_description,
                          //Forge
                          "forge_version"             : project.findProperty('forge_version') ?: '',
                          "forge_version_range"       : project.findProperty('forge_version_range') ?: '',
                          "forge_loader_version_range": project.findProperty('forge_loader_version_range') ?: '',
                          //NeoForge
                          "neo_version"               : neo_version,
                          "neo_version_range"         : neo_version_range,
                          "neo_loader_version_range"  : neo_loader_version_range,
                          //Parchment mappings
                          "parchment_version"         : parchment_version]
        filesMatching(['pack.mcmeta', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand(properties)
        }

        inputs.properties(properties)
    }
}
